<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授权失败 - 设备报修系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
        }
        
        .error-card {
            animation: fadeIn 0.6s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .btn-hover {
            transition: all 0.3s ease;
        }
        
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="error-card max-w-md w-full bg-white rounded-2xl shadow-lg p-8 text-center">
        <!-- 错误图标 -->
        <div class="w-24 h-24 mx-auto bg-red-50 rounded-full flex items-center justify-center mb-6">
            <i class="fa fa-lock text-5xl text-red-500"></i>
        </div>
        
        <!-- 标题 -->
        <h1 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-gray-800 mb-3">授权失败</h1>
        
        <!-- 主要提示 -->
        <p class="text-gray-600 text-lg mb-6">您暂无权限访问此系统，请先联系管理员处理</p>
        
        <!-- 联系信息 -->
        <div class="bg-blue-50 rounded-xl p-4 mb-8 text-left">
            <h3 class="font-medium text-blue-700 mb-2 flex items-center">
                <i class="fa fa-phone-square mr-2"></i>联系管理员
            </h3>
            <ul class="text-gray-600 space-y-2">
                <li class="flex items-center">
                    <i class="fa fa-envelope-o text-blue-500 mr-2"></i>
                    <span>邮箱：354820250@qq.com</span>
                </li>
                <li class="flex items-center">
                    <i class="fa fa-mobile text-blue-500 mr-2 text-lg"></i>
                    <span>电话：13122077570 张 </span>
                </li>
                <li class="flex items-center">
                    <i class="fa fa-clock-o text-blue-500 mr-2"></i>
                    <span>工作时间：周一至周五 9:00-17:00</span>
                </li>
            </ul>
        </div>
        
        <!-- 底部说明 -->
        <p class="text-gray-400 text-sm mt-8">
            <i class="fa fa-info-circle mr-1"></i>如需获取访问权限，请提供您的身份信息给管理员审核
        </p>
    </div>
    
    <!-- 简单的页面动画效果 -->
    <script>
        // 页面加载时的淡入效果
        document.addEventListener('DOMContentLoaded', function() {
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.5s ease';
                document.body.style.opacity = '1';
            }, 100);
        });
    </script>
</body>
</html>
