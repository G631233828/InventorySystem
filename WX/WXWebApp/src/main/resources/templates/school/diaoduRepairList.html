<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>工单管理 - 调度人员端</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- 引入外部资源 -->
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<script type="text/javascript" th:src="@{/assets/js/tailwindcs-3.4.17.js}"></script>

<!-- Tailwind 配置 -->
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    primary: '#3B82F6',    // 主色调：蓝色
                    pending: '#F59E0B',    // 待处理状态色
                    assigned: '#3B82F6',   // 已分配状态色
                    processing: '#6366F1', // 处理中状态色
                    completed: '#10B981',  // 已完成状态色
                    cancelled: '#6B7280',  // 已取消状态色
                    urgent: '#EF4444',     // 紧急级别色
                    normal: '#3B82F6',     // 一般级别色
                }
            }
        }
    }
</script>

<style type="text/tailwindcss">
    @layer utilities {
        .content-auto { content-visibility: auto; }
        .form-input-focus { @apply focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none; }
        .shadow-soft { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }
        .status-badge { @apply text-xs font-semibold px-2.5 py-0.5 rounded-full; }
        .level-badge { @apply text-xs font-semibold px-2 py-0.5 rounded-full; }
        .card-hover { @apply transition-all duration-300 hover:shadow-md hover:-translate-y-0.5 cursor-pointer; }
        .filter-active { @apply bg-primary text-white; }
        .filter-inactive { @apply bg-gray-100 text-gray-700 hover:bg-gray-200; }
        .clear-btn { @apply absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 cursor-pointer transition-colors; }
    }
</style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm fixed top-0 left-0 right-0 z-50 transition-all duration-300">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold text-primary flex items-center">
                <i class="fa fa-tasks mr-2"></i>维修列表管理
            </h1>
          <!--   <div class="flex items-center space-x-4">
                <div class="relative">
                    <button class="flex items-center space-x-2 text-sm font-medium text-neutral">
                        <img class="w-7 h-7 rounded-full object-cover border-2 border-primary/20"
                             th:src="${userInfo?.headImgUrl}" th:alt="${userInfo?.nickname}"
                             src="https://picsum.photos/id/1005/100/100" alt="默认头像">
                        <span th:text="${userInfo?.nickname}">调度人员</span>
                    </button>
                </div>
            </div> -->
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 pt-20 pb-6">
        <!-- 页面标题和操作区 -->
        <div class="mb-6 pt-4">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div>
                    <h2 class="text-xl font-bold text-gray-800">报修工单管理</h2>
                    <p class="text-gray-500 text-sm">点击工单查看详情并管理</p>
                </div>
                <button id="refreshBtn" class="inline-flex items-center justify-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 transition-colors">
                    <i class="fa fa-refresh mr-2"></i> 刷新
                </button>
            </div>
            
            <!-- 搜索框（增加清除按钮） -->
            <div class="mt-4 flex">
                <div class="relative flex-grow">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa fa-search text-gray-400"></i>
                    </div>
                    <input type="text" id="searchInput"
                           class="block w-full pl-10 pr-10 py-2 border border-gray-300 rounded-md leading-5 bg-white placeholder-gray-500 focus:outline-none focus:form-input-focus text-sm transition-all"
                           placeholder="搜索工单号、报修学校、报修校区、报修教室、设备名称..." th:value="${search}">
                    <!-- 清除按钮 -->
                    <button id="clearSearchBtn" class="clear-btn hidden" aria-label="清除搜索内容">
                        <i class="fa fa-times"></i>
                    </button>
                </div>
                <button id="searchBtn" class="ml-2 px-4 py-2 bg-primary text-white rounded-md text-sm font-medium hover:bg-primary/90 transition-colors">
                    <i class="fa fa-search mr-1"></i> 搜索
                </button>
            </div>
            
            <!-- 筛选条件区 -->
            <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 状态筛选 -->
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-2">维修状态</label>
                    <select id="statusSelect" class="block w-full px-3 py-2 border border-gray-300 rounded-md leading-5 bg-white text-gray-700 focus:outline-none focus:form-input-focus text-sm transition-all">
                        <option value="">全部状态</option>
                        <option value="1" th:selected="${status == '1'}">待处理</option>
                        <option value="2" th:selected="${status == '2'}">已分配</option>
                        <option value="3" th:selected="${status == '3'}">处理中</option>
                        <option value="4" th:selected="${status == '4'}">已完成</option>
                        <option value="5" th:selected="${status == '5'}">已取消</option>
                    </select>
                </div>
                
                <!-- 维修人员筛选 -->
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-2">维修人员</label>
                    <select id="workerSelect" class="block w-full px-3 py-2 border border-gray-300 rounded-md leading-5 bg-white text-gray-700 focus:outline-none focus:form-input-focus text-sm transition-all">
                        <option value="">全部维修人员</option>
                        <option th:each="worker : ${workers}" 
                                th:value="${worker.id}" 
                                th:text="${worker.name}"
                                th:selected="${workerId == worker.id}">维修人员</option>
                    </select>
                </div>
            </div>
            
            <!-- 快捷筛选标签 -->
            <div class="mt-4 flex flex-wrap gap-2">
                <button class="filter-btn inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-full" 
                        th:classappend="${status == null or status == '' ? 'filter-active' : 'filter-inactive'}" 
                        data-status="">
                    <i class="fa fa-tag mr-1"></i>全部工单
                </button>
                <button class="filter-btn inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-full" 
                        th:classappend="${status == '1' ? 'filter-active' : 'filter-inactive'}" 
                        data-status="1">
                    <i class="fa fa-clock-o mr-1"></i>待处理
                </button>
                <button class="filter-btn inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-full" 
                        th:classappend="${status == '2' ? 'filter-active' : 'filter-inactive'}" 
                        data-status="2">
                    <i class="fa fa-user mr-1"></i>已分配
                </button>
                <button class="filter-btn inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-full" 
                        th:classappend="${status == '3' ? 'filter-active' : 'filter-inactive'}" 
                        data-status="3">
                    <i class="fa fa-cogs mr-1"></i>处理中
                </button>
                <button class="filter-btn inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-full" 
                        th:classappend="${status == '4' ? 'filter-active' : 'filter-inactive'}" 
                        data-status="4">
                    <i class="fa fa-check mr-1"></i>已完成
                </button>
            </div>
            
            <!-- 筛选结果统计 -->
            <div class="mt-3 text-sm text-gray-500">
                <span id="resultCount" th:text="'共 ' + ${repairList != null ? repairList.size() : 0} + ' 条工单'">共 0 条工单</span>
            </div>
        </div>

        <!-- 工单列表 -->
        <div class="space-y-4" id="repairListContainer">
            <div th:each="repair : ${repairList}" class="repair-item">
                <!-- 状态变量定义 -->
                <div class="bg-white rounded-lg shadow-soft overflow-hidden card-hover"
                     th:with="statusEnum=${T(zhongchiedu.common.utils.enums.RepairStatus).fromCode(repair.status)},
                             statusClass=${statusEnum == T(zhongchiedu.common.utils.enums.RepairStatus).PENDING ? 'bg-pending/10 text-pending' : 
                                          statusEnum == T(zhongchiedu.common.utils.enums.RepairStatus).ASSIGNED ? 'bg-assigned/10 text-assigned' : 
                                          statusEnum == T(zhongchiedu.common.utils.enums.RepairStatus).PROCESSING ? 'bg-processing/10 text-processing' : 
                                          statusEnum == T(zhongchiedu.common.utils.enums.RepairStatus).COMPLETED ? 'bg-completed/10 text-completed' : 'bg-cancelled/10 text-cancelled'},
                             levelClass=${repair.urgencyLevel == '紧急' ? 'bg-urgent/10 text-urgent' : 'bg-normal/10 text-normal'}">
                    
                    <!-- 使用a标签实现跳转 -->
                    <a th:href="@{/wechatrp/findWxRepair/{id}(id=${repair.id})}" class="block p-4 no-underline text-gray-800">
                        <!-- 顶部信息 -->
                        <div class="flex justify-between items-start mb-3">
                            <!-- 工单号 -->
                            <div>
                                <span class="text-xs font-medium text-gray-500">工单号</span>
                                <p class="font-medium text-primary" th:text="${repair.workOrderNumber}">#WX20240520001</p>
                            </div>
                            
                            <!-- 状态标签 -->
                            <span class="status-badge" th:classappend="${statusClass}"
                                  th:text="${statusEnum?.description ?: '未知状态'}">待处理</span>
                        </div>

                        <!-- 核心信息 - 调整为6列布局 -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4 mb-4">
                            <div class="lg:col-span-2">
                                <span class="text-xs font-medium text-gray-500 block mb-1">报修学校</span>
                                <p class="text-sm font-medium" th:text="${repair.wxReporter?.schoolName ?: '未知学校'}">第一中学</p>
                            </div>
                            <div class="lg:col-span-1">
                                <span class="text-xs font-medium text-gray-500 block mb-1">报修校区</span>
                                <p class="text-sm font-medium" th:text="${repair.wxReporter?.campus ?: '未知校区'}">本部校区</p>
                            </div>
                            <div class="lg:col-span-1">
                                <span class="text-xs font-medium text-gray-500 block mb-1">报修教室</span>
                                <p class="text-sm font-medium" th:text="${repair.reportClassroomRepair}">一号教学楼302教室</p>
                            </div>
                            <div class="lg:col-span-1">
                                <span class="text-xs font-medium text-gray-500 block mb-1">报修设备</span>
                                <p class="text-sm font-medium" th:text="${repair.equipmentRepair}">多媒体一体机</p>
                            </div>
                            <div class="lg:col-span-1">
                                <span class="text-xs font-medium text-gray-500 block mb-1">紧急程度</span>
                                <span class="level-badge" th:classappend="${levelClass}"
                                      th:text="${repair.urgencyLevel}">紧急</span>
                            </div>
                        </div>

                        <!-- 处理人员信息 -->
                        <div class="mb-4">
                            <span class="text-xs font-medium text-gray-500 block mb-1">处理人员</span>
                            <p class="text-sm" th:text="${repair.worker?.name ?: '未分配'}">未分配</p>
                        </div>

                        <!-- 故障信息 -->
                        <div class="mb-4">
                            <span class="text-xs font-medium text-gray-500 block mb-1">故障描述</span>
                            <p class="text-sm text-gray-700 line-clamp-2" th:text="${repair.faultInformation}">
                                设备无法开机，电源指示灯不亮，投影无显示，疑似电源故障。
                            </p>
                        </div>

                        <!-- 报修人信息 -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-3 pt-3 border-t border-gray-100">
                            <div>
                                <span class="text-xs font-medium text-gray-500 block mb-1">报修人</span>
                                <p class="text-sm" th:text="${repair.wxReporter?.userName ?: '未知'}">张三</p>
                            </div>
                            <div>
                                <span class="text-xs font-medium text-gray-500 block mb-1">联系电话</span>
                                <p class="text-sm" th:text="${repair.wxReporter?.contactNumber ?: '未知'}">13800138000</p>
                            </div>
                            <div>
                                <span class="text-xs font-medium text-gray-500 block mb-1">提交时间</span>
                                <p class="text-sm" th:text="${repair.createTime != null ? #dates.format(repair.createTime, 'yyyy-MM-dd HH:mm') : '暂无时间'}">2024-05-20 09:30</p>
                            </div>
                        </div>

                        <!-- 底部信息 -->
                        <div class="flex justify-between items-center pt-3 border-t border-gray-100">
                            <div class="text-xs text-gray-500">
                                <i class="fa fa-clock-o mr-1"></i>
                                <span th:text="${repair.createTime != null ? #dates.format(repair.createTime, 'yyyy-MM-dd') : '暂无时间'}">2024-05-20</span>
                            </div>
                            <span class="text-xs text-primary hover:text-primary/80 transition-colors">
                                查看详情 <i class="fa fa-angle-right ml-1"></i>
                            </span>
                        </div>
                    </a>
                </div>
            </div>
            
            <!-- 空状态提示 -->
            <div id="emptyState" class="py-16 flex flex-col items-center justify-center text-center"
                 th:if="${repairList == null or repairList.isEmpty()}">
                <div class="w-24 h-24 rounded-full bg-primary/10 flex items-center justify-center text-primary mb-4">
                    <i class="fa fa-file-text-o text-4xl"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">暂无报修工单</h3>
                <p class="text-gray-500 max-w-md mb-6">系统中暂无报修工单，用户提交后将显示在此处</p>
                <button class="inline-flex items-center justify-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 transition-colors"
                        onclick="location.reload()">
                    <i class="fa fa-refresh mr-2"></i> 刷新页面
                </button>
            </div>
        </div>
    </main>

    <!-- JavaScript -->
    <script>
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 获取筛选元素
            const searchInput = document.getElementById('searchInput');
            const clearSearchBtn = document.getElementById('clearSearchBtn');
            const statusSelect = document.getElementById('statusSelect');
            const workerSelect = document.getElementById('workerSelect');
            const filterButtons = document.querySelectorAll('.filter-btn');
            const refreshBtn = document.getElementById('refreshBtn');
            const searchBtn = document.getElementById('searchBtn');
            
            // 初始化清除按钮状态
            updateClearButtonVisibility();
            
            // 导航栏滚动效果
            window.addEventListener('scroll', function() {
                const header = document.querySelector('header');
                if (window.scrollY > 10) {
                    header.classList.add('shadow');
                    header.classList.add('py-2');
                    header.classList.remove('py-3');
                } else {
                    header.classList.remove('shadow');
                    header.classList.add('py-3');
                    header.classList.remove('py-2');
                }
            });
            
            // 搜索框输入事件 - 更新清除按钮显示状态
            searchInput.addEventListener('input', updateClearButtonVisibility);
            
            // 清除按钮点击事件
            clearSearchBtn.addEventListener('click', function() {
                searchInput.value = '';
                updateClearButtonVisibility();
                searchInput.focus();
                // 如果需要立即搜索空内容，可以调用搜索函数
                // submitFiltersToServer();
            });
            
            // ESC键清除搜索内容
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    clearSearchBtn.click();
                }
            });
            
            // 更新清除按钮显示状态
            function updateClearButtonVisibility() {
                if (searchInput.value.trim() !== '') {
                    clearSearchBtn.classList.remove('hidden');
                } else {
                    clearSearchBtn.classList.add('hidden');
                }
            }
            
            // 筛选按钮点击事件（调用后端接口）
            filterButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    // 更新状态选择框
                    const statusValue = this.getAttribute('data-status');
                    statusSelect.value = statusValue;
                    
                    // 提交筛选条件到后端
                    submitFiltersToServer();
                });
            });
            
            // 搜索按钮点击事件
            searchBtn.addEventListener('click', submitFiltersToServer);
            
            // 状态选择框变化事件
            statusSelect.addEventListener('change', submitFiltersToServer);
            
            // 维修人员选择框变化事件
            workerSelect.addEventListener('change', submitFiltersToServer);
            
            // 刷新按钮
            refreshBtn.addEventListener('click', function() {
                // 重置所有筛选条件并刷新页面
                window.location.href = '../wechatrp/operator_repairlist';
            });
            
            // 支持回车键搜索
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submitFiltersToServer();
                }
            });
            
            // 提交筛选条件到后端
            function submitFiltersToServer() {
                const searchTerm = searchInput.value.trim();
                const selectedStatus = statusSelect.value;
                const selectedWorkerId = workerSelect.value;
                
                // 构建查询参数
                const params = new URLSearchParams();
                if (searchTerm) params.append('search', searchTerm);
                if (selectedStatus) params.append('status', selectedStatus);
                if (selectedWorkerId) params.append('workerId', selectedWorkerId);
                
                // 跳转到筛选后的页面（GET请求）
                window.location.href = `../wechatrp/operator_repairlist?${params.toString()}`;
            }
        });
    </script>
</body>
</html>
