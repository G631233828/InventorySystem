<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>暂无签到任务</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script th:src="@{/assets/js/tailwindcs-3.4.17.js}"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: system-ui, sans-serif; }
        .empty-animation {
            animation: fadeIn 0.6s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        grayl: '#9CA3AF'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

<main class="max-w-md w-full bg-white rounded-2xl shadow p-8 text-center empty-animation">
    <div class="w-20 h-20 bg-gray-100 rounded-full mx-auto flex items-center justify-center">
        <i class="fa fa-calendar-times-o text-4xl text-grayl"></i>
    </div>

    <h1 class="text-xl font-bold text-gray-800 mt-6">
        当前暂无签到任务
    </h1>
    <p class="text-gray-500 mt-2 mb-6">
        请等待管理员发布签到任务后再进入
    </p>

    <div class="text-xs text-gray-400 space-y-1">
        <p>如需帮助，请联系系统管理员</p>
        <p>感谢您的配合</p>
    </div>
</main>

</body>
</html>
