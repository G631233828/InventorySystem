<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head th:include="public/public_css::pub_css"></head>
<head>
<meta charset="utf-8">
<!-- 引入foundation-datepicker样式（与参考页面路径一致） -->
<link th:href="@{/plugs/fdatapicker/css/foundation-datepicker.css}"
	rel="stylesheet" type="text/css">
</head>
<body>
	<!-- Preloader -->
	<div id="preloader">
		<div id="status">&nbsp;</div>
	</div>
	<!-- TOP NAVBAR -->
	<div th:replace="public/public::top"></div>
	<!-- /END OF TOP NAVBAR -->
	<!-- SIDE MENU -->
	<div th:replace="public/public::left(activeUri='basic')"></div>
	<!-- END OF SIDE MENU -->
	<!--  PAPER WRAP -->
	<div class="wrap-fluid">
		<div class="container-fluid paper-wrap bevel tlbr">
			<!-- CONTENT -->
			<!--TITLE -->
			<div th:replace="public/public::title"></div>
			<!--/ TITLE -->
			<!-- BREADCRUMB -->
			<div th:replace="public/public::menu"></div>
			<!-- END OF BREADCRUMB -->
			<div class="content-wrap">
				<div class="row">
					<div class="col-sm-12">
						<div class="nest" id="ValidationClose">
							<div class="title-alt">
								<h6>售后项目保障信息</h6>
								<div class="titleClose">
									<a class="gone" href="#ValidationClose"> <span class="entypo-cancel"></span>
									</a>
								</div>
								<div class="titleToggle">
									<a class="nav-toggle-alt" href="#Validation"> <span class="entypo-up-open"></span>
									</a>
								</div>
							</div>
							<div class="body-nest" id="Validation">
								<form class="form-horizontal row-border" id="afterSalesProjectsForm" 
									th:action="@{/afterSalesProject}" 
									method="post" th:object="${afterSalesProjects}">
									<input type="hidden" name="_method" th:value="${afterSalesProjects?.id} != null ? 'PUT' : 'POST'"/>
									<input type="hidden" th:if="${afterSalesProjects!=null}" name="id" th:value="${afterSalesProjects?.id}"/>
									
									<!-- 项目名称 -->
									<div class="form-group">
										<label class="col-sm-2 control-label">项目名称 <span class="text-danger">*</span></label>
										<div class="col-sm-10">
											<input type="text" class="form-control" id="projectName" name="projectName" 
												th:value="${afterSalesProjects?.projectName}" placeholder="请输入项目名称">
										</div>
									</div>
									
									<!-- 学校名称 -->
									<div class="form-group">
										<label class="col-sm-2 control-label">学校名称 <span class="text-danger">*</span></label>
										<div class="col-sm-10">
											<input type="text" class="form-control" name="schoolName" 
												th:value="${afterSalesProjects?.schoolName}" placeholder="请输入学校名称">
										</div>
									</div>
									
									<!-- 中标单位 -->
									<div class="form-group">
										<label class="col-sm-2 control-label">中标单位</label>
										<div class="col-sm-10">
											<input type="text" class="form-control" name="winningBidder" 
												th:value="${afterSalesProjects?.winningBidder}" placeholder="请输入中标单位">
										</div>
									</div>
									
									<!-- 联系老师 -->
									<div class="form-group">
										<label class="col-sm-2 control-label">联系老师</label>
										<div class="col-sm-10">
											<input type="text" class="form-control" name="contactTeacher" 
												th:value="${afterSalesProjects?.contactTeacher}" placeholder="请输入联系老师">
										</div>
									</div>
									
									<!-- 老师电话 -->
									<div class="form-group">
										<label class="col-sm-2 control-label">老师电话</label>
										<div class="col-sm-10">
											<input type="text" class="form-control" name="teacherPhone" 
												th:value="${afterSalesProjects?.teacherPhone}" placeholder="请输入老师电话">
										</div>
									</div>
									
									<!-- 学校地址 -->
									<div class="form-group">
										<label class="col-sm-2 control-label">学校地址</label>
										<div class="col-sm-10">
											<input type="text" class="form-control" name="schoolAddress" 
												th:value="${afterSalesProjects?.schoolAddress}" placeholder="请输入学校地址">
										</div>
									</div>
									
									<!-- 施工队 -->
									<div class="form-group">
										<label class="col-sm-2 control-label">施工队</label>
										<div class="col-sm-10">
											<input type="text" class="form-control" name="worker" 
												th:value="${afterSalesProjects?.worker}" placeholder="请输入施工队">
										</div>
									</div>
									
									<!-- 保修开始时间：添加唯一ID + readonly，与参考页面保持一致 -->
									<div class="form-group">
										<label class="col-sm-2 control-label">保修开始时间</label>
										<div class="col-sm-10">
											<input type="text" class="form-control" id="warrantyStartTime" name="warrantyStartTime" 
												th:value="${afterSalesProjects?.warrantyStartTime}" placeholder="请选择保修开始时间" readonly="readonly">
										</div>
									</div>
									
									<!-- 保修截止时间：添加唯一ID + readonly，与参考页面保持一致 -->
									<div class="form-group">
										<label class="col-sm-2 control-label">保修截止时间</label>
										<div class="col-sm-10">
											<input type="text" class="form-control" id="warrantyEndTime" name="warrantyEndTime" 
												th:value="${afterSalesProjects?.warrantyEndTime}" placeholder="请选择保修截止时间" readonly="readonly">
										</div>
									</div>
									
									<!-- 项目年份 -->
									<div class="form-group">
										<label class="col-sm-2 control-label">项目年份</label>
										<div class="col-sm-10">
											<input type="text" class="form-control" name="projectYear" 
												th:value="${afterSalesProjects?.projectYear}" placeholder="请输入项目年份（格式：yyyy）">
										</div>
									</div>
									
									<div class="form-actions">
										<div class="row">
											<div class="col-sm-12">
												<div class="pull-right">
													<button type="submit" class="btn btn-primary">提交</button>
													<button type="button" class="btn btn-default" onclick="window.location.href='@{/afterSalesProjects}'">返回</button>
												</div>
											</div>
										</div>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!--  END OF PAPER WRAP -->
	<div th:replace="public/public::footer"></div>
	<!-- 底部js -->
	<div th:replace="public/public_js::pub_js"></div>
	<div th:replace="public/public_js::validator"></div>
	
	<!-- 引入foundation-datepicker核心JS（与参考页面路径一致） -->
	<script th:src="@{/plugs/fdatapicker/js/foundation-datepicker.js}"></script>
	<script th:src="@{/plugs/fdatapicker/js/locales/foundation-datepicker.zh-CN.js}"></script>
	
	<script type="text/javascript" th:src="@{/js/admin/afterSalesProjects/afterSalesProjects.js}"></script>
	
	<!-- 初始化日期选择器（参考预计取货时间的初始化逻辑） -->
	<script type="text/javascript">
		// 页面加载完成后初始化
		$(function() {
			// 初始化保修开始时间
			$('#warrantyStartTime').fdatepicker({
				format: 'yyyy-mm-dd', // 与参考页面一致的日期格式
				language: 'zh-CN',    // 中文显示
				autoclose: true,      // 选择后自动关闭
				todayHighlight: true, // 高亮今日
				readonly: true        // 只读，仅通过控件选择
			});
			
			// 初始化保修截止时间
			$('#warrantyEndTime').fdatepicker({
				format: 'yyyy-mm-dd',
				language: 'zh-CN',
				autoclose: true,
				todayHighlight: true,
				readonly: true,
				// 可选：限制截止时间不能早于开始时间
				minDate: function() {
					return $('#warrantyStartTime').val() || new Date();
				}
			});
		});
	</script>
</body>
</html>
