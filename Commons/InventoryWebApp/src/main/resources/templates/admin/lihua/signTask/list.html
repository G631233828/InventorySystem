<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:include="public/public_css::pub_css"></th:block>
    <link rel="stylesheet" type="text/css" th:href="@{/assets/js/progress-bar/number-pb.css}">
    <link th:href="@{/plugs/sweetalert/sweetalert.css}" rel="stylesheet">
    <style>
        .table-scroll-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            width: 100%;
            margin: 0 auto;
            scrollbar-width: thin;
            scrollbar-color: #888 #f1f1f1;
        }
        .table-scroll-container::-webkit-scrollbar { height: 8px; }
        .table-scroll-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .table-scroll-container::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        .table-scroll-container::-webkit-scrollbar-thumb:hover { background: #555; }
        .table-scroll-container table {
            width: 100%;
            table-layout: auto;
            min-width: max-content;
            border-collapse: collapse;
        }
        .table-scroll-container table th,
        .table-scroll-container table td {
            vertical-align: middle;
            overflow: visible;
            text-overflow: clip;
            padding: 8px 12px;
            white-space: nowrap;
            word-wrap: normal;
            word-break: keep-all;
        }
        .search-form {
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .search-form .form-group { margin-bottom: 0; }
    </style>
</head>
<body>
<div id="preloader"><div id="status">&nbsp;</div></div>
<div th:replace="public/public::top"></div>
<div th:replace="public/public::left(activeUri='params')"></div>

<div class="wrap-fluid">
    <div class="container-fluid paper-wrap bevel tlbr">
        <div th:replace="public/public::title"></div>
        <div th:replace="public/public::menu"></div>

        <div class="content-wrap">
            <div class="row">
                <div class="col-sm-12">
            <!--         <div class="body-nest" id="alert" th:if="${errorImport!=''}">
                        <div class="alert alert-danger">
                            <button data-dismiss="alert" class="close" type="button">×</button>
                            <th:block th:utext="${errorImport}"></th:block>
                        </div>
                    </div> -->

                    <div class="nest" id="tableStaticClose">
                        <div class="title-alt">
                            <div class="search-form">
                                <shiro:hasPermission name="signTasks:add">
                                    <button class="btn btn-default btn-sm" th:onclick="|window.location.href='@{/signTask}'|">
                                        <i class="glyphicon glyphicon-plus"></i> 添加
                                    </button>
                                </shiro:hasPermission>
                                <shiro:hasPermission name="signTasks:edit">
                                    <button class="btn btn-primary btn-sm" onclick="return toeditPage('','signTask')">
                                        <i class="fa fa-edit"></i> 编辑
                                    </button>
                                </shiro:hasPermission>
                                <shiro:hasPermission name="signTasks:delete">
                                    <button class="btn btn-danger btn-sm" th:onclick="|return del('','@{/signTask/}')|">
                                        <i class="fa fa-trash-o"></i> 删除
                                    </button>
                                </shiro:hasPermission>

                                <div class="form-inline" style="display: flex; align-items: center;">
                                    <select class="form-control input-sm" id="pageSize" onchange="return searchSize()">
                                        <option value="10" th:selected="${pageSize == 10}">10</option>
                                        <option value="20" th:selected="${pageSize == 20}">20</option>
                                        <option value="50" th:selected="${pageSize == 50}">50</option>
                                        <option value="100" th:selected="${pageSize == 100}">100</option>
                                    </select>
                                    <input class="form-control input-sm" id="search" placeholder="搜索签到任务名称"
                                           th:value="${search}" type="text" style="width: 200px; margin-left: 5px;">
                                    <button class="btn btn-default btn-sm" onclick="return searchVal()" style="margin-left: 5px;">
                                        <i class="entypo-search"></i> 搜索
                                    </button>
                                </div>
                            </div>

                            <div class="titleClose">
                                <a class="gone" href="#tableStaticClose">
                                    <span class="entypo-cancel"></span>
                                </a>
                            </div>
                            <div class="titleToggle">
                                <a class="nav-toggle-alt" href="#tableStatic">
                                    <span class="entypo-up-open"></span>
                                </a>
                            </div>
                        </div>

                        <div class="body-nest" id="tableStatic">
                            <div class="table-scroll-container">
                                <section id="flip-scroll">
                                    <table class="table table-bordered table-striped cf">
                                        <thead class="cf">
                                        <tr>
                                            <th style="width:20px;">
                                                <div class="checkbox checkbox-inline" style="margin-top:0">
                                                    <input type="checkbox" id="checkall" name="checkall"/>
                                                    <label for="checkall"></label>
                                                </div>
                                            </th>
                                            <th>签到任务名称</th>
                                            <th>开始时间</th>
                                            <th>结束时间</th>
                                            <th>状态</th>
                                            <th>操作</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <th:block th:each="task:${pageList.datas}">
                                            <tr>
                                                <td>
                                                    <div class="checkbox checkbox-inline" style="margin-top:0">
                                                        <input type="checkbox" name="ids" th:id="${task.id}" th:value="${task.id}">
                                                        <label th:for="${task.id}"></label>
                                                    </div>
                                                </td>
                                                <td>[[${task?.taskName} ?: '-']]</td>
                                                <td>[[${task?.startTime} ?: '-']]</td>
                                                <td>[[${task?.endTime} ?: '-']]</td>
                                                <td th:id="disBtn+${task.id}" shiro:hasPermission="signTasks:disable"
                                                    th:utext="${task.isDisable eq true }?
                                                    '<button type=&quot;button&quot; onclick=toDisable(&quot;'+${task.id}+'&quot;,&quot;signTask&quot;) class=&quot;btn btn-danger btn-xs&quot;>禁用</button>'
                                                    :'<button type=&quot;button&quot; onclick=toDisable(&quot;'+${task.id}+'&quot;,&quot;signTask&quot;) class=&quot;btn btn-success btn-xs&quot;>启用</button>'">
                                                </td>
                                                <td>
                                                    <shiro:hasPermission name="signTasks:edit">
                                                        <button class="btn btn-primary btn-xs" th:onclick="|return toeditPage('${task.id}','signTask')|">
                                                            <i class="fa fa-edit"></i> 编辑
                                                        </button>
                                                    </shiro:hasPermission>
                                                    <shiro:hasPermission name="signTasks:delete">
                                                        <button class="btn btn-danger btn-xs" th:onclick="|return del('@{/signTask/}${task.id}','')|">
                                                            <i class="fa fa-trash-o"></i> 删除
                                                        </button>
                                                    </shiro:hasPermission>
                                                </td>
                                            </tr>
                                        </th:block>
                                        </tbody>
                                    </table>
                                </section>
                            </div>

                            <form method="post" id="deleteForm">
                                <input name="_method" value="delete" type="hidden">
                            </form>

                            <div class="row mt-2">
                                <div class="col-md-12">
                                    <div class="col-md-6">
                                        <div class="dataTables_info hidden-xs" th:text="|每页${pageList.pageSize}条 · 当前${pageList.pageNo}页 · 共${pageList.totalPage}页|"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <ul class="pagination pagination-split pull-right">
                                            <li th:class="${pageList.pageNo==1}?'disabled':''">
                                                <a th:href="${pageList.pageNo==1}?'javascript:void(0)':@{/signTasks(pageNo=${pageList.upPage},pageSize=${pageSize},search=${search})}">上一页</a>
                                            </li>
                                            <li th:each="p:${pageList.navigatepageNums}" th:class="${p==pageList.pageNo}?'active':''">
                                                <a th:href="@{/signTasks(pageNo=${p},pageSize=${pageSize},search=${search})}">[[${p}]]</a>
                                            </li>
                                            <li th:class="${pageList.pageNo==pageList.totalPage}?'disabled':''">
                                                <a th:href="${pageList.pageNo==pageList.totalPage}?'javascript:void(0)':@{/signTasks(pageNo=${pageList.nextPage},pageSize=${pageSize},search=${search})}">下一页</a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="public/public::myModal"></div>
    </div>
</div>

<script type="text/javascript" th:inline="javascript"
		th:src="@{/js/admin/lihua/signTask/signTasklist.js}"></script>
<script th:src="@{/plugs/prettyfile/bootstrap-prettyfile.js}"></script>
<div th:replace="public/public::right"></div>
<div th:replace="public/public_js::pub_js"></div>
<div th:replace="public/public_js::public_script"></div>
<div th:replace="public/public::footer"></div>
<script th:src="@{/plugs/sweetalert/sweetalert.min.js}"></script>
<div th:replace="public/public_js::validator"></div>
</body>
</html>
